[platformio]
default_envs = release_waveshare_esp32_s3_lcd_169

[env]
platform = espressif32@6.9.0
framework = arduino
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.9
monitor_speed = 115200
extra_scripts = pre:extraScript.py
custom_prog_name = GALAGINO PLUS
custom_prog_version = V1.1.0
board_build.arduino.partitions = partitions.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_unflags = -fno-rtti
 
build_flags =
    -D ARDUINO_RUNNING_CORE=0   ;default is 1
    -D BUILD_ENV_NAME=$PIOENV

build_src_flags =
    -Wunknown-pragmas

build_src_filter =
    +<*>
    -<machines/*>
    +<machines/galaxian/*>
    -<emulation/nunchuck.*>
    -<emulation/audio.*>
    -<cpus/*>
    +<cpus/z80/*>

[env:release_waveshare_esp32_s3_lcd_169]
board = esp32-s3-devkitc-1
build_type = release
monitor_raw = yes
upload_port = /dev/ttyACM0
build_flags = ${env.build_flags}
    -D WAVESHARE_ESP32_S3_LCD_169
    -D TFT_SPICLK=80000000
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0

[env:release_cheapYellowDisplay]
board = esp32-2432W328C
build_type = release
monitor_raw = yes
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags}
    -D CHEAP_YELLOW_DISPLAY_CONF
    -D TFT_SPICLK=80000000
    -D CORE_DEBUG_LEVEL=0

[env:debug_cheapYellowDisplay]
board = esp32-2432W328C
build_type = debug
monitor_filters = esp32_exception_decoder
build_flags = ${env.build_flags}
    -D CHEAP_YELLOW_DISPLAY_CONF
    -D TFT_SPICLK=80000000


[env:release_azDeliveryDevKitV4]
board = az-delivery-devkit-v4
build_type = release
monitor_raw = yes
lib_deps =
build_flags = ${env.build_flags}
    -D TFT_SPICLK=40000000
    -D CORE_DEBUG_LEVEL=0

[env:debug_azDeliveryDevKitV4]
board = az-delivery-devkit-v4
build_type = debug
monitor_filters = esp32_exception_decoder
lib_deps =
build_flags = ${env.build_flags}
    -D TFT_SPICLK=40000000

[env:release_Nintendo]
board = az-delivery-devkit-v4
build_type = release
monitor_raw = yes
lib_deps =
    https://github.com/dmadison/NintendoExtensionCtrl
build_flags = ${env.build_flags}
    -D TFT_SPICLK=40000000
    -D NUNCHUCK_INPUT
    -D CORE_DEBUG_LEVEL=0
